<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagens — Morajo</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            font-family: 'Georgia', serif;
            color: #e0e0e0;
        }
        .centro {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 30px;
            text-align: center;
        }
        .titulo {
            font-size: 1.8em;
            margin-bottom: 40px;
            color: #c9b1ff;
            line-height: 1.6;
        }
        .caixa-senha {
            background: rgba(255,255,255,0.05);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(201, 177, 255, 0.2);
            box-shadow: 0 0 30px rgba(107, 70, 193, 0.15);
            max-width: 400px;
            width: 100%;
        }
        .caixa-senha h2 {
            color: #c9b1ff;
            margin-bottom: 20px;
            font-size: 1.3em;
        }
        input {
            padding: 14px;
            width: 100%;
            font-size: 18px;
            text-align: center;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(201, 177, 255, 0.3);
            border-radius: 8px;
            color: #fff;
            outline: none;
            margin-bottom: 15px;
            letter-spacing: 4px;
        }
        button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #6b46c1, #553c9a);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
        .erro {
            color: #ff6b6b;
            margin-top: 15px;
            display: none;
        }
        .pagina-mensagem {
            display: none;
            max-width: 500px;
            padding: 30px;
            text-align: center;
        }
        .nome {
            font-size: 2em;
            color: #c9b1ff;
            margin-bottom: 30px;
        }
        .mensagem {
            font-size: 1.2em;
            line-height: 1.8;
            background: rgba(255,255,255,0.05);
            padding: 30px;
            border-radius: 12px;
            border-left: 3px solid #c9b1ff;
            color: #ddd;
        }
        .voltar {
            margin-top: 30px;
            color: #c9b1ff;
            text-decoration: none;
            font-size: 0.95em;
            display: inline-block;
        }
        .voltar:hover {
            text-decoration: underline;
        }
        .assinatura {
            margin-top: 40px;
            font-style: italic;
            color: #888;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div id="pagina-login" class="centro">
        <h1 class="titulo">Se você tá vendo isso,<br>eu morri.<br>Assinado: Morajo.</h1>
        <div class="caixa-senha">
            <h2>Digite sua senha:</h2>
            <input type="password" id="senha" placeholder="••••" maxlength="6">
            <br>
            <button onclick="verificarSenha()">Entrar</button>
            <p class="erro" id="erro-senha">Senha incorreta. Tente novamente.</p>
        </div>
    </div>

    <div id="pagina-mensagem" class="centro pagina-mensagem">
        <h2 class="nome" id="nome-pessoa"></h2>
        <p class="mensagem" id="texto-mensagem"></p>
        <p class="assinatura">— Morajo ✨</p>
        <a href="#" class="voltar" onclick="voltar()">← Sair</a>
    </div>

    <script>
        const dados = {
            "0102": {
                nome: "Pólux",
                mensagem: "Ah oi Pólux, você é mó gente boa. Tu tirou o algoritmos de mim, sou muito grato. E se cuida. Eu fui, mas tô te vendo."
            },
            "0505": {
                nome: "Wike",
                mensagem: "Wike eu sei tu é mó legal mais eu não resisti eu passei por muito perrengue aqui e claro nunca vou esquecer hoje RS e POR FAVOR NAO SE MATA EU TE IMPLORO não foi culpa sua que me matei enfim fica com Abel se é legal gosto de tu"
            },
            "0305": {
                nome: "Linn",
                mensagem: "Oi linn você me avisou e eu não escutei eu me matei na minha casa e POR FAVOR NAO VEM ME REVIVER mas eu gosto de tu d+ tu é legal tu se importa comigo e etc bom chegou meu fim adeus literalmente KAKKAKA"
            },
            "0404": {
                nome: "Tia Susie",
                mensagem: "Susie tu é muito engraçada Kakakak mas chegou minha hora de virar uma estrela lá do céu não sei se sabe mais eu me matei gosto de tu muito gente boa ADEUSS"
            },
            "0306": {
                nome: "Morajo",
                mensagem: "EAI mano toras eu morri eh mas ou menos assim eu me matei enfim MEU IRMÃO TE AMO DE VDD"
            },
            "6742": {
                nome: "Azedo",
                mensagem: "oi azedo KAKAKAKAKA gosto de tu 676767 Farma aura aí na terra por mim gosto de tu mesmo não parecendo abraço Farma aura e ego fica com abel"
            },
            "0859": {
                nome: "Zulmi",
                mensagem: "AH OI ZULMI GURIA ti te deixando e deixando a turma tchau guria azul"
            }
        };

        function verificarSenha() {
            const senha = document.getElementById('senha').value;
            if (dados[senha]) {
                document.getElementById('pagina-login').style.display = 'none';
                document.getElementById('pagina-mensagem').style.display = 'block';
                document.getElementById('nome-pessoa').textContent = dados[senha].nome;
                document.getElementById('texto-mensagem').textContent = dados[senha].mensagem;
            } else {
                document.getElementById('erro-senha').style.display = 'block';
            }
        }

        function voltar() {
            document.getElementById('pagina-login').style.display = 'flex';
            document.getElementById('pagina-mensagem').style.display = 'none';
            document.getElementById('senha').value = '';
            document.getElementById('erro-senha').style.display = 'none';
        }

        document.getElementById('senha').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verificarSenha();
        });
    </script>
</body>
</html>
